<!-- ELECTRICAL PRESETS (CATEGORY + DROPDOWN) -->
<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 no-print space-y-3">
  <h2 class="text-sm font-bold uppercase tracking-wide text-amber-400">⚡ Electrical Material & Labor Library</h2>
  
  <div class="space-y-2">
    <!-- Category Filter -->
    <div>
      <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Select Category</label>
      <select id="presetCategory" class="w-full bg-slate-900 border-2 border-slate-700 rounded-lg p-2.5 text-white font-bold">
        <option value="all">All Electrical Presets</option>
        <option value="panels">Service Panels & Breakers</option>
        <option value="wiring">Wire & Cable</option>
        <option value="lighting">Lighting & Fixtures</option>
        <option value="ev">EV Chargers & Outlets</option>
        <option value="labor">Common Labor Rates</option>
      </select>
    </div>

    <!-- Presets Dropdown -->
    <div>
      <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Select Preset Item</label>
      <select id="presetSelector" class="w-full bg-slate-900 border-2 border-slate-700 rounded-lg p-2.5 text-white font-bold">
        <!-- Dynamically populated from JS library -->
      </select>
    </div>

    <!-- Add Button -->
    <button id="btnAddPreset" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-lg text-sm shadow flex items-center justify-center gap-1">
      ➕ Add Selected Preset to Itemized List
    </button>
  </div>
</div>
